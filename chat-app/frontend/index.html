<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <script type="module" src="websocket.mjs"></script>
    <title>Chat</title>
  </head>
  <body>
    <main>
      <h1>Chat messages</h1>

      <div
        id="messages-root"
        class="messages-container"
        aria-live="polite"
      ></div>

      <template id="show-message-template">
        <article class="show-message">
          <div class="message-body">
            <h2 class="message-username"></h2>
            <p class="message-content"></p>
            <time class="message-created-time"></time>
            <button class="reaction-btn" data-action="like" >Like</button>
            <button class="reaction-btn" data-action="dislike" >Dislike</button>
          </div>
        </article>
      </template>
      <form id="message-form">
        <label for="username-input">Username</label>
        <input
          type="text"
          name="username"
          id="username-input"
          placeholder="Enter username"
          required
          minlength="2"
          maxlength="100"
        />
        <label for="message-input">Message</label>
        <textarea
          name="message"
          id="message-input"
          required
          minlength="1"
          maxlength="500"
        ></textarea>
        <button type="submit" id="submit-button" disabled>Send message</button>
      </form>
      <p id="form-feedback" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
